version: "3.8"

networks:
  public-network:
    external: true

services:
  jellyfin:
    image: keke/nas-portal
    container_name: portal
    ports:
      - 8000:8000
    restart: 'unless-stopped'
    volumes:
      - ${PWD}/.env:/project/.env
      
    networks:
      public-network:
        ipv4_address: ${PORTAL_HOST}