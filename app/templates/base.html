{# Example base.html <head> section #}
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}My Site{% endblock %}</title>
    
        {# Link to your main portal CSS #}
        <link rel="stylesheet" href="{{ url_for('static', path='/css/portal_style.css') }}">
    
        {# Font Awesome #}
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
        {# Google Fonts #}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    
        {# Optional: Inline style block or link to login-specific CSS #}
        <style>
            /* --- Add login-specific styles here or in a separate CSS file --- */
    
            /* Ensure body has the correct font if not globally set */
            body.login-page {
                font-family: 'Noto Sans SC', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                /* Re-apply centering styles if base.html doesn't already do this */
                display: flex;
                align-items: center; /* Vertical center */
                justify-content: center; /* Horizontal center */
                min-height: 100vh;
                 /* Make sure background from portal_style.css applies */
            }
    
            /* Style the login box container */
            .login-box {
                 /* Inherits .frosted-glass */
                max-width: 420px; /* Control maximum width */
                width: 90%;      /* Responsive width */
                text-align: center; /* Center align title */
            }
    
            .login-box h2 {
                color: #ffffff;
                font-weight: 400; /* Adjust weight */
                margin-bottom: 1.5rem;
                font-size: 1.8rem; /* Adjust size */
            }
    
            /* Style form elements within the login box */
            .login-box .form-label {
                color: rgba(255, 255, 255, 0.8); /* Lighter label */
                font-weight: 300;
                font-size: 0.9rem;
                display: block; /* Ensure label is on its own line */
                text-align: left; /* Align label text left */
                margin-bottom: 0.3rem;
            }
    
            .login-box .form-control {
                background-color: rgba(255, 255, 255, 0.1); /* Subtle light background */
                border: 1px solid rgba(255, 255, 255, 0.2); /* Subtle light border */
                color: #ffffff; /* White text input */
                border-radius: 8px; /* Slightly rounded inputs */
                padding: 0.75rem 1rem; /* Adjust padding */
                font-size: 1rem;
                width: 100%; /* Ensure full width */
                box-sizing: border-box; /* Include padding in width */
                margin-bottom: 1rem; /* Space below input */
            }
    
            .login-box .form-control::placeholder {
                color: rgba(255, 255, 255, 0.5); /* Dimmer placeholder */
                opacity: 1; /* Override browser defaults if needed */
            }
    
            .login-box .form-control:focus {
                background-color: rgba(255, 255, 255, 0.15);
                border-color: rgba(255, 255, 255, 0.4);
                outline: none; /* Remove default outline */
                box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1); /* Custom focus ring */
            }
    
            /* Style the submit button */
            .login-box .btn-submit {
                background-color: #0d6efd; /* Example blue */
                color: #ffffff;
                border: none;
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
                font-weight: 500;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.3s ease, transform 0.2s ease;
                width: 100%; /* Full width button */
                margin-top: 0.5rem; /* Space above button */
            }
    
            .login-box .btn-submit:hover {
                background-color: #0b5ed7; /* Darker blue on hover */
                transform: translateY(-2px);
            }
            .login-box .btn-submit:active {
                transform: translateY(0);
            }
    
    
            /* Style the error message */
            .login-box .alert-danger {
                background-color: rgba(220, 53, 69, 0.2); /* Transparent red */
                border: 1px solid rgba(220, 53, 69, 0.4);
                color: #f8d7da; /* Light red text */
                border-radius: 8px;
                padding: 0.8rem 1rem;
                margin-bottom: 1rem; /* Space below alert */
                text-align: left;
                font-size: 0.9rem;
            }
        </style>
    
        {% block extra_head %}{% endblock %}
    </head>
