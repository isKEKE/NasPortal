<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NasPortal Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --border: rgba(24, 35, 64, 0.13);
            --text: #0c1428;
            --muted: #65708b;
            --primary: #2f5cff;
            --success: #18b866;
            --danger: #d94848;
            --shadow: 0 24px 70px rgba(20, 33, 70, 0.12);
            --font-ui: "Space Grotesk", "Segoe UI", sans-serif;
            --font-display: "Silkscreen", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 12% 12%, rgba(47, 92, 255, 0.1), transparent 28%),
                radial-gradient(circle at 88% 84%, rgba(24, 184, 102, 0.1), transparent 28%),
                var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
        }

        .login-panel {
            width: min(440px, 100%);
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: var(--shadow);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border: 2px solid var(--text);
            border-radius: 9px;
            color: var(--success);
            background: linear-gradient(180deg, #ffffff, #e9efff);
            font-family: var(--font-display);
        }

        h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.7rem;
            line-height: 1;
        }

        .subtitle {
            margin: 5px 0 0;
            color: var(--primary);
            font-weight: 800;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.88rem;
            font-weight: 800;
        }

        input {
            width: 100%;
            height: 48px;
            margin-bottom: 18px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 13px;
            outline: 0;
            background: #fbfcff;
            color: var(--text);
            font: inherit;
        }

        input:focus {
            border-color: rgba(47, 92, 255, 0.46);
            box-shadow: 0 0 0 4px rgba(47, 92, 255, 0.08);
        }

        .login-button {
            width: 100%;
            height: 50px;
            border: 1px solid rgba(47, 92, 255, 0.5);
            border-radius: 13px;
            background: #ffffff;
            color: var(--primary);
            font: inherit;
            font-weight: 900;
            cursor: pointer;
        }

        .login-hint {
            margin: 16px 0 0;
            color: var(--muted);
            font-size: 0.88rem;
            text-align: center;
        }

        .alert-danger {
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid rgba(217, 72, 72, 0.28);
            border-radius: 12px;
            color: var(--danger);
            background: rgba(217, 72, 72, 0.08);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="login-panel">
        <div class="brand-row">
            <div class="brand-mark">&gt;_</div>
            <div>
                <h1>NasPortal</h1>
                <p class="subtitle">personal terminal</p>
            </div>
        </div>

        {% if error %}
        <div class="alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/login">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="admin" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" value="admin" autocomplete="current-password" required>

            <button type="submit" class="login-button">Log in</button>
            <p class="login-hint">Default local test account: admin / admin</p>
        </form>
    </main>
</body>
</html>
