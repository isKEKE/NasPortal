<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Login</title>

    <!-- Font Awesome for icons (optional) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Basic Reset & Body Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans SC', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('../static/img/portal-background.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        /* Frosted Glass Effect */
        .frosted-glass {
            background-color: rgba(40, 40, 50, 0.65);
            backdrop-filter: blur(15px) saturate(120%);
            -webkit-backdrop-filter: blur(15px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            padding: 30px 35px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .login-box h2 {
            color: #ffffff;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 1.8rem;
            font-size: 2rem;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
            font-size: 0.9rem;
            display: block;
            text-align: left;
            margin-bottom: 0.4rem;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 1.2rem;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.55);
            opacity: 1;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.45);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .btn-submit {
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            padding: 0.85rem 1.5rem;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            margin-top: 0.8rem;
        }

        .btn-submit:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #f8d7da;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }

        .alert-danger i {
            margin-right: 0.6rem;
            font-size: 1.1em;
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            .frosted-glass {
                padding: 20px 25px;
            }
            .login-box h2 {
                font-size: 1.6rem;
                margin-bottom: 1.5rem;
            }
            .form-control {
                font-size: 0.95rem;
                padding: 0.7rem 0.8rem;
            }
            .btn-submit {
                font-size: 1rem;
                padding: 0.8rem 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-box frosted-glass">
        <h2>User Login</h2>

        <form method="post" action="/auth/login" novalidate>
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-submit">Log In</button>
        </form>

    </div>

</body>
</html>
